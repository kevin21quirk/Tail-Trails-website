<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Tails & Trails</title>
  <link rel="stylesheet" href="assets/main.css" />
  <style>
    .admin-page { min-height: 100vh; background: var(--sand); }
    .admin-header { display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 4vw; background: var(--white); box-shadow: 0 2px 14px rgba(0,0,0,.06); position: sticky; top: 0; z-index: 100; }
    .admin-header .brand { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--teal-dark); }
    .tabs { display: flex; gap: .8rem; flex-wrap: wrap; }
    .tab { background: transparent; border: 1px solid var(--teal); color: var(--teal-dark); padding: .5rem 1.2rem; border-radius: 999px; cursor: pointer; font-weight: 600; }
    .tab.active { background: var(--teal); color: #fff; }
    .admin-main { max-width: 1200px; margin: 0 auto; padding: 2rem 4vw 4rem; }
    .panel { display: none; background: var(--white); border-radius: var(--radius); padding: 1.5rem; box-shadow: var(--shadow); margin-bottom: 1.5rem; }
    .panel.active { display: block; }
    .panel h2 { color: var(--teal-dark); font-family: 'Playfair Display', serif; margin-bottom: 1.2rem; }
    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; align-items: end; }
    label { display: block; font-size: .85rem; font-weight: 600; color: var(--teal-dark); margin: 1rem 0 .4rem; }
    input, select, textarea { width: 100%; padding: .7rem .9rem; border: 1px solid #d6e0d4; border-radius: 10px; font-size: 1rem; box-sizing: border-box; }
    table { width: 100%; border-collapse: collapse; font-size: .95rem; }
    th, td { text-align: left; padding: .7rem; border-bottom: 1px solid #eee; }
    th { color: var(--teal-dark); font-weight: 700; }
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: .5rem; }
    .cal-cell { background: #f3f6f2; border-radius: 10px; min-height: 110px; padding: .5rem; cursor: pointer; position: relative; }
    .cal-cell.other { color: #aaa; background: #fafafa; }
    .cal-cell .day { font-weight: 700; font-size: .85rem; color: var(--teal-dark); }
    .cal-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal-dark); margin: 3px 2px 0 0; display: inline-block; }
    .day-popup { position: fixed; inset: 0; background: rgba(11,25,11,.65); display: none; align-items: center; justify-content: center; z-index: 200; }
    .day-popup.active { display: flex; }
    .day-card { background: var(--white); border-radius: var(--radius); padding: 1.5rem; width: min(92%, 500px); max-height: 80vh; overflow: auto; }
    .day-card h3 { margin-bottom: .8rem; color: var(--teal-dark); }
    .dropzone { border: 2px dashed var(--teal); border-radius: 12px; padding: 2rem; text-align: center; color: var(--teal-dark); cursor: pointer; }
    .dropzone input { display: none; }
  </style>
</head>
<body class="admin-page">
  <header class="admin-header">
    <div class="brand">Tails & Trails — Admin</div>
    <div class="tabs">
      <button class="tab active" data-tab="calendar">Calendar</button>
      <button class="tab" data-tab="clients">Clients</button>
      <button class="tab" data-tab="bookings">Bookings</button>
      <button class="tab" data-tab="invoices">Invoices</button>
      <button class="tab" data-tab="receipts">Receipts</button>
      <button class="tab" data-tab="media">Media</button>
      <a href="login.html" class="tab" style="text-decoration:none">Logout</a>
    </div>
  </header>

  <main class="admin-main">
    <section id="calendar" class="panel active">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
        <h2 id="cal-month">Calendar</h2>
        <div>
          <button class="btn btn-outline" id="prev-month">←</button>
          <button class="btn btn-outline" id="next-month">→</button>
        </div>
      </div>
      <div class="calendar" id="calendar-grid"></div>
    </section>

    <section id="clients" class="panel">
      <h2>Clients</h2>
      <form id="client-form" class="form-row" style="margin-bottom:1.5rem">
        <div><label>Name</label><input type="text" name="name" required /></div>
        <div><label>Email</label><input type="email" name="email" required /></div>
        <div><label>Temporary password</label><input type="text" name="password" required /></div>
        <div><label>Dog name & breed</label><input type="text" name="dog_name" /></div>
        <div><label>Phone</label><input type="tel" name="phone" /></div>
        <div style="align-self:end"><button type="submit" class="btn btn-primary">Add client</button></div>
      </form>
      <table id="clients-table"><tr><th>Name</th><th>Dog</th><th>Email</th><th>Phone</th><th></th></tr></table>
    </section>

    <section id="bookings" class="panel">
      <h2>New booking</h2>
      <form id="booking-form" class="form-row" style="margin-bottom:1.5rem">
        <div><label>Client</label><select name="client_id" id="booking-client" required></select></div>
        <div><label>Date</label><input type="date" name="booking_date" required /></div>
        <div><label>Start</label><input type="time" name="start_time" /></div>
        <div><label>End</label><input type="time" name="end_time" /></div>
        <div><label>Service</label>
          <select name="service" required>
            <option value="walk">Dog walking</option>
            <option value="daycare">Day care</option>
            <option value="feeding">Feeding / home visit</option>
            <option value="combined">Combined day care & walk</option>
          </select>
        </div>
        <div style="align-self:end"><button type="submit" class="btn btn-primary">Add booking</button></div>
      </form>
      <table id="bookings-table"><tr><th>Client</th><th>Dog</th><th>Date</th><th>Time</th><th>Service</th><th></th></tr></table>
    </section>

    <section id="invoices" class="panel">
      <h2>Create invoice</h2>
      <form id="invoice-form" class="form-row" style="margin-bottom:1.5rem">
        <div><label>Client</label><select name="client_id" id="invoice-client" required></select></div>
        <div><label>Amount (£)</label><input type="number" step="0.01" name="amount" required /></div>
        <div><label>Description</label><input type="text" name="description" /></div>
        <div><label>Due date</label><input type="date" name="due_date" /></div>
        <div style="align-self:end"><button type="submit" class="btn btn-primary">Create invoice</button></div>
      </form>
      <table id="invoices-table"><tr><th>Client</th><th>Amount</th><th>Description</th><th>Status</th><th></th></tr></table>
    </section>

    <section id="receipts" class="panel">
      <h2>Record payment</h2>
      <form id="receipt-form" class="form-row" style="margin-bottom:1.5rem">
        <div><label>Client</label><select name="client_id" id="receipt-client" required></select></div>
        <div><label>Amount (£)</label><input type="number" step="0.01" name="amount" required /></div>
        <div style="align-self:end"><button type="submit" class="btn btn-primary">Record payment</button></div>
      </form>
      <table id="receipts-table"><tr><th>Client</th><th>Amount</th><th>Date</th><th></th></tr></table>
    </section>

    <section id="media" class="panel">
      <h2>Upload photos / videos</h2>
      <form id="media-form" style="margin-bottom:1.5rem">
        <div class="form-row">
          <div><label>Client</label><select name="client_id" id="media-client" required></select></div>
          <div><label>Caption</label><input type="text" name="caption" /></div>
        </div>
        <label class="dropzone" id="dropzone">
          <input type="file" id="media-files" multiple accept="image/*,video/*" />
          <div>Click or drag images &amp; videos here</div>
        </label>
        <button type="submit" class="btn btn-primary" style="margin-top:1rem">Upload</button>
      </form>
      <table id="media-table"><tr><th>Client</th><th>File</th><th>Caption</th><th>Date</th><th></th></tr></table>
    </section>
  </main>

  <div class="day-popup" id="day-popup">
    <div class="day-card">
      <h3 id="day-title"></h3>
      <div id="day-content"></div>
      <button class="btn btn-outline" onclick="document.getElementById('day-popup').classList.remove('active')" style="margin-top:1rem">Close</button>
    </div>
  </div>

  <script src="assets/admin.js"></script>
</body>
</html>
