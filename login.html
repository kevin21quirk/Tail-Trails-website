<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Login | Tails & Trails</title>
  <link rel="icon" href="Public/logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="Public/logo.png" />
  <link rel="stylesheet" href="assets/main.css" />
  <style>
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 2rem; background: #0a1a0a; }
    .login-card { width: min(100%, 420px); background: var(--white); border-radius: var(--radius); padding: 2.5rem; box-shadow: var(--shadow); text-align: center; }
    .login-card .paw { font-size: 2.2rem; margin-bottom: .8rem; }
    .login-card h1 { font-family: 'Playfair Display', serif; color: var(--teal-dark); margin-bottom: .5rem; font-size: 1.7rem; }
    .login-card p { color: #58646e; margin-bottom: 1.6rem; }
    .login-card label { display: block; text-align: left; font-size: .85rem; font-weight: 600; color: var(--teal-dark); margin: 1rem 0 .4rem; }
    .login-card input { width: 100%; padding: .8rem 1rem; border: 1px solid #d6e0d4; border-radius: 12px; font-size: 1rem; box-sizing: border-box; }
    .login-card button { width: 100%; margin-top: 1.4rem; padding: .8rem; }
    .login-card .switch { display: block; margin-top: 1.4rem; color: var(--teal-dark); font-size: .9rem; cursor: pointer; text-decoration: underline; }
    .login-card .error { color: #c33; font-size: .9rem; margin-top: .8rem; display: none; }
    .login-card .error.visible { display: block; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="paw">🐾</div>
      <h1 id="title">Client Login</h1>
      <p id="subtitle">Access your dog's bookings, photos and invoices.</p>
      <form id="login-form">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required placeholder="your@email.com" />
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••" />
        <button type="submit" class="btn btn-primary">Log in</button>
        <div class="error" id="error"></div>
      </form>
      <a href="index.html" class="switch" id="switch">← Back to website</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const error = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.classList.remove('visible');
      error.textContent = '';
      const data = Object.fromEntries(new FormData(form));

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(data),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Login failed.');

        if (json.user.role === 'admin') {
          window.location.href = '/admin.html';
        } else {
          window.location.href = '/portal.html';
        }
      } catch (err) {
        error.textContent = err.message;
        error.classList.add('visible');
      }
    });

    if (window.location.hash === '#admin') {
      document.getElementById('title').textContent = 'Admin Login';
      document.getElementById('subtitle').textContent = 'Alyssia\'s dashboard for clients, bookings and media.';
    }
  </script>
</body>
</html>
