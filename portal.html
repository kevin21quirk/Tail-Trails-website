<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Portal | Tracks & Trails by Alyssia</title>
  <link rel="icon" href="Public/trackandtrailslogo.png" type="image/png" />
  <link rel="apple-touch-icon" href="Public/trackandtrailslogo.png" />
  <link rel="stylesheet" href="assets/main.css" />
  <style>
    .portal-page { min-height: 100vh; background: var(--sand); }
    .portal-header {
      position: fixed; inset: 0 0 auto 0; z-index: 1000;
      display: flex; align-items: center; justify-content: space-between;
      gap: 1.5rem; padding: .75rem 5vw;
      background: rgba(10,18,10,.90);
      backdrop-filter: blur(22px) saturate(160%);
      box-shadow: 0 2px 30px rgba(0,0,0,.4), 0 1px 0 rgba(107,142,35,.22);
    }
    .portal-header .portal-nav {
      display: flex; align-items: center; gap: 1rem;
      padding: .55rem 1.2rem;
      background: rgba(10,18,10,.62);
      backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid rgba(107,142,35,.38);
      border-radius: 999px;
      box-shadow: 0 8px 32px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06);
    }
    .portal-header .greeting { color: rgba(255,255,255,.85); font-size: .92rem; white-space: nowrap; }
    .portal-main { padding-top: 90px; }
    .portal-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; padding: 2rem 4vw 4rem; max-width: 1200px; margin: 0 auto; }
    .portal-card { background: var(--white); border-radius: var(--radius); padding: 1.5rem; box-shadow: var(--shadow); }
    .portal-card h3 { color: var(--teal-dark); margin-bottom: 1rem; font-family: 'Playfair Display', serif; }
    .portal-card.full { grid-column: span 2; }
    .empty { color: #888; font-size: .9rem; }
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
    .media-thumb { border-radius: 12px; overflow: hidden; aspect-ratio: 1; cursor: pointer; background: #e8e8e0; position: relative; }
    .media-thumb img, .media-thumb video { width: 100%; height: 100%; object-fit: cover; }
    .media-thumb span { position: absolute; bottom: 6px; right: 8px; background: rgba(0,0,0,.5); color: #fff; font-size: .7rem; padding: .15rem .4rem; border-radius: 6px; }
    .media-dl { position: absolute; top: 7px; right: 7px; width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; display: flex; align-items: center; justify-content: center; text-decoration: none; opacity: 0; transition: opacity .2s; z-index: 2; }
    .media-thumb:hover .media-dl { opacity: 1; }
    .lb-actions { display: flex; gap: .8rem; justify-content: center; margin-top: .9rem; }
    .booking, .invoice { display: flex; justify-content: space-between; align-items: center; padding: .8rem 0; border-bottom: 1px solid #eee; }
    .booking:last-child, .invoice:last-child { border-bottom: none; }
    .status { font-size: .75rem; font-weight: 700; text-transform: uppercase; padding: .2rem .6rem; border-radius: 999px; background: #e6efe4; color: var(--teal-dark); }
    .status.unpaid { background: #fbe9e7; color: #c33; }
    .invoice-amount { font-weight: 700; color: var(--teal-dark); }
    @media (max-width: 760px) {
      .portal-grid { grid-template-columns: 1fr; padding: 1rem 4vw 3rem; gap: 1rem; }
      .portal-card.full { grid-column: span 1; }
    }
    @media (max-width: 600px) {
      .portal-header { padding: .55rem 4vw; }
      .portal-main { padding-top: 78px; }

      /* Cards */
      .portal-card { padding: 1rem; border-radius: 16px; }
      .portal-card h3 { font-size: 1.05rem; margin-bottom: .75rem; }

      /* Booking rows: stack details below date */
      .booking { flex-wrap: wrap; gap: .25rem; padding: .65rem 0; }
      .booking > div:first-child { width: 100%; }
      .booking .status { margin-top: .1rem; }

      /* Invoice rows: keep amount visible but tighter */
      .invoice { flex-wrap: wrap; gap: .25rem; padding: .65rem 0; }
      .invoice > div:first-child { flex: 1; min-width: 0; }
      .invoice > div:last-child { flex-shrink: 0; text-align: right; }

      /* Media grid: smaller thumbnails */
      .media-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: .6rem; }
    }
    @media (max-width: 400px) {
      .media-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: .5rem; }
    }
  </style>
</head>
<body class="portal-page">
  <header class="portal-header">
    <a href="index.html"><img src="Public/trackandtrailslogo.png" alt="Tracks &amp; Trails" class="header-logo" /></a>
    <div class="portal-nav">
      <span class="greeting" id="greeting"></span>
      <a href="login.html" class="btn btn-outline" style="font-size:.85rem; padding:.4rem 1rem; color:#fff; border-color:rgba(255,255,255,.4)">Log out</a>
    </div>
  </header>

  <main class="portal-main">
    <div class="portal-grid">
      <div class="portal-card full">
        <h3>Upcoming walks & care</h3>
        <div id="bookings-list"><p class="empty">Loading…</p></div>
      </div>

      <div class="portal-card full">
        <h3>Previous walks & appointments</h3>
        <div id="past-list"><p class="empty">Loading…</p></div>
      </div>

      <div class="portal-card full">
        <h3>Latest photos & videos</h3>
        <div id="media-list" class="media-grid"><p class="empty">Loading…</p></div>
      </div>

      <div class="portal-card">
        <h3>Invoices</h3>
        <div id="invoices-list"><p class="empty">Loading…</p></div>
      </div>

      <div class="portal-card">
        <h3>Receipts</h3>
        <div id="receipts-list"><p class="empty">Loading…</p></div>
      </div>
    </div>
  </main>

  <div id="lightbox" class="popup-overlay" style="z-index:10000" onclick="this.classList.remove('active')">
    <div class="popup-card" style="max-width: 90%; width: auto; min-width:300px" onclick="event.stopPropagation()">
      <img id="lb-img" style="width:100%; border-radius:12px" src="" alt="" />
      <video id="lb-vid" style="width:100%; border-radius:12px; display:none" controls></video>
      <div class="lb-actions">
        <a id="lb-download" href="#" download class="btn btn-primary" style="display:inline-flex;align-items:center;gap:.5rem;font-size:.9rem">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download
        </a>
        <button onclick="document.getElementById('lightbox').classList.remove('active')" class="btn btn-outline" style="font-size:.9rem">Close</button>
      </div>
    </div>
  </div>

  <script>
    async function load() {
      const me = await fetch('/api/auth/me', { credentials: 'include' });
      if (!me.ok) return window.location.href = '/login.html';
      const { user } = await me.json();
      document.getElementById('greeting').textContent = `Hi, ${user.name}`;

      const dash = await fetch('/api/client/dashboard', { credentials: 'include' });
      const data = await dash.json();
      if (!dash.ok) throw new Error(data.error);

      // Bookings
      const bList = document.getElementById('bookings-list');
      const fmtBooking = b => `
        <div class="booking">
          <div>
            <strong>${new Date(b.booking_date).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'long' })}</strong>
            ${b.start_time ? `&nbsp;·&nbsp;${b.start_time.slice(0,5)}` : ''}
            <div style="font-size:.85rem;color:#666">${b.service.replace(/\b\w/g, l => l.toUpperCase())}${b.notes ? ' · ' + b.notes : ''}</div>
          </div>
          <span class="status">${b.status}</span>
        </div>`;

      bList.innerHTML = data.upcoming.length
        ? data.upcoming.map(fmtBooking).join('')
        : '<p class="empty">No upcoming bookings.</p>';

      const pList = document.getElementById('past-list');
      pList.innerHTML = (data.past || []).length
        ? data.past.map(fmtBooking).join('')
        : '<p class="empty">No previous bookings yet.</p>';

      // Media
      const mediaRes = await fetch('/api/client/media', { credentials: 'include' });
      const mediaData = await mediaRes.json();
      const mList = document.getElementById('media-list');
      mList.innerHTML = (mediaData.media || []).length ? (mediaData.media || []).map(m => `
        <div class="media-thumb" data-url="${m.url}" data-dl="${m.downloadUrl}" data-type="${m.type}" data-name="${m.filename}">
          ${m.type === 'video' ? `
            <video src="${m.url}" preload="metadata" muted></video>
            <span>▶</span>
          ` : `<img src="${m.url}" alt="${m.caption || m.filename}" />`}
          <a class="media-dl" href="${m.downloadUrl}" download="${m.filename}" title="Download" onclick="event.stopPropagation()">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </a>
        </div>
      `).join('') : '<p class="empty">No media uploaded yet.</p>';

      document.querySelectorAll('.media-thumb').forEach(thumb => {
        thumb.addEventListener('click', () => {
          const url = thumb.dataset.url;
          const dl = thumb.dataset.dl;
          const name = thumb.dataset.name;
          const type = thumb.dataset.type;
          const lb = document.getElementById('lightbox');
          const img = document.getElementById('lb-img');
          const vid = document.getElementById('lb-vid');
          const dlBtn = document.getElementById('lb-download');
          dlBtn.href = dl; dlBtn.download = name;
          if (type === 'video') { img.style.display = 'none'; vid.style.display = 'block'; vid.src = url; }
          else { img.style.display = 'block'; vid.style.display = 'none'; img.src = url; vid.pause(); }
          lb.classList.add('active');
        });
      });

      // Invoices
      const iList = document.getElementById('invoices-list');
      iList.innerHTML = data.invoices.length ? data.invoices.map(i => {
        const dateVal = i.due_date || i.created_at;
        const dateStr = dateVal ? new Date(dateVal).toLocaleDateString('en-GB') : '—';
        const dateLabel = i.due_date ? 'Due ' + dateStr : dateStr;
        return `
        <div class="invoice">
          <div>
            <div style="font-weight:700">${dateLabel}</div>
            <div style="font-size:.85rem;color:#666">${i.description || 'Invoice'}</div>
          </div>
          <div style="text-align:right">
            <div class="invoice-amount">£${Number(i.amount).toFixed(2)}</div>
            <span class="status ${i.status}">${i.status}</span>
          </div>
        </div>`;
      }).join('') : '<p class="empty">No invoices yet.</p>';

      // Receipts
      const rList = document.getElementById('receipts-list');
      rList.innerHTML = data.receipts.length ? data.receipts.map(r => `
        <div class="invoice">
          <div>
            <div style="font-weight:700">${new Date(r.created_at).toLocaleDateString('en-GB')}</div>
            <div style="font-size:.85rem;color:#666">Payment received</div>
          </div>
          <div class="invoice-amount">£${Number(r.amount).toFixed(2)}</div>
        </div>
      `).join('') : '<p class="empty">No receipts yet.</p>';
    }

    load().catch(err => { console.error(err); alert('Could not load portal. Please log in again.'); });
  </script>
</body>
</html>
